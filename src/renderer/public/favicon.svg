<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" stroke="#fff" stroke-width="2"/>
  
  <!-- Book icon -->
  <path d="M25 35 Q25 30 30 30 L45 30 Q50 30 50 35 L50 70 Q50 75 45 75 L30 75 Q25 75 25 70 Z" fill="white" opacity="0.9"/>
  <path d="M35 35 L35 70" stroke="url(#grad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pages -->
  <path d="M35 40 Q35 38 38 38 L45 38 Q47 38 47 40 L47 45 Q47 47 45 47 L38 47 Q35 47 35 45 Z" fill="url(#grad)" opacity="0.6"/>
  <path d="M35 50 Q35 48 38 48 L45 48 Q47 48 47 50 L47 55 Q47 57 45 57 L38 57 Q35 57 35 55 Z" fill="url(#grad)" opacity="0.6"/>
  <path d="M35 60 Q35 58 38 58 L45 58 Q47 58 47 60 L47 65 Q47 67 45 67 L38 67 Q35 67 35 65 Z" fill="url(#grad)" opacity="0.6"/>
  
  <!-- Sparkles for "learning" -->
  <circle cx="70" cy="35" r="3" fill="white" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="50" r="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="65" cy="65" r="2.5" fill="white" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
